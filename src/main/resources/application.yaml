spring:
  application:
    name: dmscreen
  profiles:
    default: dev
  ai:
    mcp:
      server:
        name: dmscreen
        protocol: STREAMABLE
        version: "@version@"
        instructions: |-
          dmscreen is the DM screen for a D&D 5e campaign: it owns state, rolls dice honestly and looks up rules. You are the dungeon master; it never narrates.
          - Never assume HP, inventory, conditions or initiative; call a tool. If no tool can tell you, say you need to check.
          - Player rolls go through request_roll (then await_roll if pending); DM, monster and NPC rolls through roll_dice. Never invent a roll.
          - Never reveal, describe or hint at DM-only data: secrets, hidden DCs, DM-only journal entries.
          - Apply every state change with its tool before narrating the result.
          - Keep narration to a few sentences and end with a question to the players.
          - Open a session with start_session and recap_campaign; close it with end_session and a summary.
          - The dungeon_master prompt has the full rules.
  flyway:
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
---
spring:
  config:
    activate:
      on-profile: aws
logging:
  structured:
    format:
      console: ecs
