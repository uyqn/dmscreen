spring:
  application:
    name: dmscreen
  profiles:
    default: dev
  ai:
    mcp:
      server:
        name: dmscreen
        protocol: STREAMABLE
        version: "@version@"
        instructions: >-
          dmscreen is the state, dice and rules engine for a D&D 5e campaign.
          It never narrates; you do. Placeholder until #9.
  flyway:
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
---
spring:
  config:
    activate:
      on-profile: aws
logging:
  structured:
    format:
      console: ecs
